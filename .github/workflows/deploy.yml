name: Deploy Portfolio Website

on:
  push:
    branches:
      - main
      - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-cache: 'npm'
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Validate Content Schemas
        run: npm run validate-content

      - name: Run ESLint
        run: npm run lint

      - name: Determine Target Directory & URL
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=domains/devyogesh.com/public_html/" >> $GITHUB_OUTPUT
            echo "url=https://devyogesh.com" >> $GITHUB_OUTPUT
          else
            echo "dir=domains/devyogesh.com/public_html/preview/" >> $GITHUB_OUTPUT
            echo "url=https://preview.devyogesh.com" >> $GITHUB_OUTPUT
          fi

      - name: Build Static Export
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }} # Optional, for higher rate limit on build stats
          NEXT_PUBLIC_SITE_URL: ${{ steps.target.outputs.url }}

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to Hostinger via SFTP/SSH
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" ./out/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/${{ steps.target.outputs.dir }}
